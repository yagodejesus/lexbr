[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lexbr"
version = "0.1.0"
description = "Leis brasileiras estruturadas para RAG e legal tech: transforme o texto de leis e decretos numa árvore de artigos, parágrafos, incisos e alíneas, extraia citações ('art. 7º, IX, da LGPD') e gere trechos com contexto e URN LexML."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yago de Jesus Martins" }]
keywords = ["legislação", "lei", "legal tech", "rag", "lexml", "nlp", "direito", "chunking", "llm", "brasil"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Legal Industry",
  "Natural Language :: Portuguese (Brazilian)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/yagodejesus/lexbr"
Issues = "https://github.com/yagodejesus/lexbr/issues"

[project.scripts]
lexbr = "lexbr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lexbr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905", "E501"]
